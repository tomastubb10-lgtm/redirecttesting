<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HTTPS Basic Auth Request</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }
        input {
            display: block;
            margin: 10px 0;
            padding: 8px;
            width: 300px;
        }
        button {
            padding: 10px 15px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            white-space: pre-wrap;
            background: #f4f4f4;
            padding: 10px;
        }
    </style>
</head>
<body>

    <h2>Send HTTPS Request with Basic Auth</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <input type="text" id="url" placeholder="https://api-cert.payconex.net/api/v4/accounts/220614986921/poi/2290064201/sale">

    <button id="sendBtn">Send Request</button>

    <div id="result"></div>

    <script>
        document.getElementById("sendBtn").addEventListener("click", function () {

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const url = document.getElementById("url").value;

            if (!username || !password || !url) {
                alert("Please fill in all fields.");
                return;
            }

            // Encode credentials in Base64
            const credentials = btoa(username + ":" + password);

            fetch(url, {
                method: "GET", // Change to POST if needed
                headers: {
                    "Authorization": "Basic " + credentials,
                    "Content-Type": "application/json"
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error("HTTP error " + response.status);
                }
                return response.text(); // use .json() if expecting JSON
            })
            .then(data => {
                document.getElementById("result").textContent = data;
            })
            .catch(error => {
                document.getElementById("result").textContent = "Error: " + error.message;
            });

        });
    </script>

</body>
</html>
